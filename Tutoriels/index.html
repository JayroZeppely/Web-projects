<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prise en main</title>
</head>
<body>
<h1>Toturiel de prise en main html</h1>
<p>Ceci est une page html basique pour se refaire la main sur le développement de <b>pages web statiques</b>.</p>

<h2>Gestion d'évènements</h2>
<button onclick="nbClickCount()">Afficher une alerte</button>
</body>
<script>
    let nbClick = 0;

    function nbClickCount() {
        nbClick++;
        alert("Vous avez cliqué sur ce bouton "+nbClick+" fois")
    }
</script>
<style>
    button {
        width: -webkit-fit-content;
        height: 50px;
        border-radius: 4px;
        border: none;
        background-color: #1e1e9a;
        color: white;
    }

    button:hover {
        background-color: #0d0d71;
    }
</style>
</html>
